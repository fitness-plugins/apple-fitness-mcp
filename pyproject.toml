[project]
name = "apple-health-mcp"
version = "0.1.0"
description = "Local MCP server exposing Apple Health export data to Claude Desktop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",  # fast columnar bulk-insert path (executemany is far too slow)
    "pytz>=2024.1",  # required by duckdb to materialize TIMESTAMPTZ into Python
]

[project.scripts]
apple-health-mcp = "apple_health_mcp.server:main"
apple-health-import = "apple_health_mcp.import_pipeline:run"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_health_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
